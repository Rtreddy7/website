<section style="margin-top: 40px;">
    <div class="app-container">
        <!-- Sidebar -->
        <aside>
            
            <nav id="sidebar-nav">
                <!-- Nav items injected by JS -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <section class="showcase-section">
                <!-- Row 1: Left to Right -->
                <div class="scroll-container">
                    <div class="animate-row-left" id="row-1">
                        <!-- Cards injected by JS -->
                    </div>
                </div>

                <!-- Row 2: Right to Left -->
                <div class="scroll-container">
                    <div class="animate-row-right" id="row-2">
                        <!-- Cards injected by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Overlay -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content" id="modal-container">
            <button onclick="closeModal()" class="modal-close">✕</button>
            <div class="modal-banner">
                <img id="modal-img" src="" alt="">
                <div class="modal-banner-overlay"></div>
                <div class="modal-banner-info">
                    <span id="modal-tag" class="card-tag" style="position: static; display: inline-block; margin-bottom: 0.5rem;">Development</span>
                    <h2 id="modal-title">Course Title</h2>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-stats">
                    <div class="stat-card">
                        <p class="stat-label">Duration</p>
                        <p id="modal-duration" class="stat-value">12 Weeks</p>
                    </div>
                    <div class="stat-card">
                        <p class="stat-label">Global Rating</p>
                        <p id="modal-rating" class="stat-value">4.8 (Verified)</p>
                    </div>
                </div>
                <p class="modal-description">
                    Elevate your career with industry-recognized certification. This immersive learning path features cinematic video quality, interactive labs, and direct access to top-tier mentors.
                </p>
                <div class="modal-actions">
                    <button class="btn-primary">Enroll Now</button>
                    <button class="btn-secondary">Syllabus</button>
                </div>
            </div>
        </div>
    </div>
</section>
