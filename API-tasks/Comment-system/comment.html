<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disco</title>
    <link rel="stylesheet" href="comment.css"/>
</head>

<body>

    <header>
        <div class="logo">Disco</div>
        <nav>
            <a href="#" id="nav-home" class="active">Home</a>
            <a href="#">Help</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <div class="hero">
                <h1>Welcome Folks <img src="./1f47d.gif" width="35px"></h1>                
                <button id="getStarted"><img src="./1f449.gif" width="22px">Get Started</button>
            </div>
        </section>

        <section id="disco">
            <div class="comments">
                <div id="commentList"></div>

                <div class="comment-form">
                    <input id="username" placeholder="Your Name" autocomplete="off" />
                    <textarea id="message" placeholder="Write a comment..."></textarea>
                    <button id="postBtn">Post</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        © Rights preserved by Ravi Tej
    </footer>

    <script src="comment.js"></script>
</body>

</html>
