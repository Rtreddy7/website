<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><img src="./images/oppty (1).png" width="30px" alt=""> Login Page</title>
    <link rel="stylesheet" href="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="container" class="show-user">

        <div class="form-box user">
            <form id="userLoginForm">
                <h1>User Login</h1>

                <div class="input-box">
                    <input type="email" id="userEmail" placeholder="User Email" required>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <div class="form-box admin">
            <form id="adminLoginForm">
                <h1>Admin Login</h1>

                <div class="input-box">
                    <input type="email" id="adminEmail" placeholder="Admin Email" required>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <div class="toggle-box">

            <div class="toggle-panel toggle-left" id="userWelcome">
                <img src="./images/oppty (1).png" width="90">
                <h1>Hello, Welcome</h1>
                <p>Are u an User?</p>
                <button class="btn user-btn">User</button>
            </div>

            <div class="toggle-panel toggle-right" id="adminWelcome">
                <img src="./images/oppty (1).png" width="90">
                <h1>Hello, Welcome</h1>
                <p>Are u an Admin?</p>
                <button class="btn admin-btn">Admin</button>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const ADMIN_EMAIL = "raviteja.n@oppty.in";
            const ADMIN_PASSWORD = "admin@123";

            const container = document.getElementById("container");

            document.querySelector(".user-btn").onclick = () => {
                container.classList.add("show-user");
                container.classList.remove("show-admin");
            };

            document.querySelector(".admin-btn").onclick = () => {
                container.classList.add("show-admin");
                container.classList.remove("show-user");
            };

            document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
                e.preventDefault();

                const email = document.getElementById("adminEmail").value.trim();
                const password = this.querySelector('input[type="password"]').value.trim();

                if (!email || !password) {
                    alert("Please enter admin email and password");
                    return;
                }

                if (email !== ADMIN_EMAIL || password !== ADMIN_PASSWORD) {
                    alert("Invalid admin credentials");
                    return;
                }

                sessionStorage.setItem("loggedInAdmin", email);
                window.location.href = "admin.html";
            });

            document.getElementById("userLoginForm").addEventListener("submit", function (e) {
                e.preventDefault();

                const email = document.getElementById("userEmail").value.trim();
                const password = this.querySelector('input[type="password"]').value.trim();

                if (!email || !password) {
                    alert("Please enter user email and password");
                    return;
                }

                const users = JSON.parse(localStorage.getItem("users")) || [];

                const user = users.find(u => u.email === email);

                if (!user) {
                    alert("User not found. Contact admin.");
                    return;
                }

                if (user.password !== password) {
                    alert("Incorrect password");
                    return;
                }

                if (user.status !== "Active") {
                    alert("User is deactivated. Contact admin.");
                    return;
                }

                user.availability = "ONLINE";
                localStorage.setItem("users", JSON.stringify(users));

                sessionStorage.setItem("loggedInUser", email);
                window.location.href = "users.html";
            });

        });
    </script>


</body>

</html>
