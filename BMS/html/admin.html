<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="pg-header">
        <div class="header-left">
            <img src="../images/oppty (1).png" width="100">
            <span class="pg-title">Admin Dashboard</span>
        </div>
        <div class="header-right">
            <span id="loggedInAdmin"></span>
            <button id="logoutBtn">Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <main class="admin-dashboard">

            <section class="admin-overview">
                <div class="overview-stuff">
                    <h4>Total Users</h4>
                    <p id="totalUsers">0</p>
                </div>
                <div class="overview-stuff">
                    <h4>Active Breaks</h4>
                    <p id="activeBreaks">0</p>
                </div>
                <div class="overview-stuff">
                    <h4>Online Users</h4>
                    <p id="onlineUsers">0</p>
                </div>
            </section>

            <section class="add-user-section">
                <h3>Add New User</h3>
                <div class="add-user-form">
                    <input type="text" id="newUsername" placeholder="Username">
                    <input type="email" id="newUserEmail" placeholder="Email">
                    <input type="password" id="newUserPassword" placeholder="Password">
                    <button id="addUserBtn">Add User</button>
                </div>
            </section>

            <section class="user-management-block">
                <h3>User Management</h3>

                <div class="user-filters">
                    <input type="text" id="userSearch" placeholder="Search username">
                    <select id="availabilityFilter">
                        <option value="all">All</option>
                        <option value="ONLINE" style="font-weight: bold;">Online</option>
                        <option value="OFFLINE" style="font-weight: bold;">Offline</option>
                    </select>
                </div>

                <table class="user-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Status</th>
                            <th>Availability</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </section>

            <section class="brak-management-section">
                <h3>Break Management</h3>
                <input type="text" id="breakSearch" placeholder="Search break user">
                <button id="downloadCsvBtn"><i class="fa-solid fa-download"></i></button>

                <table class="break-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Break Type</th>
                            <th>Date</th>
                            <th>Start Time</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="breakTableBody"></tbody>
                </table>
            </section>

        </main>
    </div>

    <script>
        const adminEmail = sessionStorage.getItem("loggedInAdmin");
        if (!adminEmail) {
            window.location.href = "../index.html";
        }

        let users = JSON.parse(localStorage.getItem("users")) || [];
        let breaks = JSON.parse(localStorage.getItem("breaks")) || [];

        let pauseRealtime = false;

        const loggedInAdmin = document.getElementById("loggedInAdmin");
        for (let i = 0; i < users.length; i++) {
            if (users[i].email === adminEmail) {
                loggedInAdmin.textContent = users[i].username;
            }
        }

        const userTableBody = document.getElementById("userTableBody");
        const breakTableBody = document.getElementById("breakTableBody");

        const userSearch = document.getElementById("userSearch");
        const availabilityFilter = document.getElementById("availabilityFilter");
        const breakSearch = document.getElementById("breakSearch");

        function clear(el) {
            while (el.firstChild) {
                el.removeChild(el.firstChild);
            }
        }

        function formatDuration(ms, type) {
            let limit = 3600000;
            if (type === "REGULAR") {
                limit = 900000;
            }
            if (ms > limit) {
                ms = limit;
            }

            let h = Math.floor(ms / 3600000);
            let m = Math.floor((ms % 3600000) / 60000);
            let s = Math.floor((ms % 60000) / 1000);

            return String(h).padStart(2, "0") + ":" +
                String(m).padStart(2, "0") + ":" +
                String(s).padStart(2, "0");
        }

        function renderUsers(search, availability) {
            clear(userTableBody);

            for (let i = 0; i < users.length; i++) {
                let u = users[i];

                if (search) {
                    if (!u.username.toLowerCase().includes(search.toLowerCase())) {
                        continue;
                    }
                }

                if (availability !== "all") {
                    if (u.availability !== availability) {
                        continue;
                    }
                }

                let tr = document.createElement("tr");

                let tdUser = document.createElement("td");
                tdUser.textContent = u.username + " (" + u.email + ")";

                let tdStatus = document.createElement("td");
                tdStatus.textContent = u.status;

                let tdAvail = document.createElement("td");
                tdAvail.textContent = u.availability;

                let tdAction = document.createElement("td");
                let select = document.createElement("select");

                let actions = ["Select", "Activate", "Deactivate", "Update", "Delete"];
                for (let j = 0; j < actions.length; j++) {
                    let opt = document.createElement("option");
                    opt.value = actions[j].toLowerCase();
                    opt.textContent = actions[j];
                    select.appendChild(opt);
                }

                select.onfocus = function () {
                    pauseRealtime = true;
                };

                select.onblur = function () {
                    pauseRealtime = false;
                };

                select.onchange = function () {
                    pauseRealtime = false;

                    if (select.value === "activate") {
                        u.status = "Active";
                        u.availability = "ONLINE";
                    }

                    if (select.value === "deactivate") {
                        u.status = "Inactive";
                        u.availability = "OFFLINE";
                    }

                    if (select.value === "update") {
                        let n = prompt("New username", u.username);
                        let e = prompt("New email", u.email);
                        if (n) u.username = n;
                        if (e) u.email = e;
                    }

                    if (select.value === "delete") {
                        users.splice(i, 1);
                    }

                    localStorage.setItem("users", JSON.stringify(users));
                    renderUsers(userSearch.value, availabilityFilter.value);
                    renderStats();
                };

                tdAction.appendChild(select);
                tr.append(tdUser, tdStatus, tdAvail, tdAction);
                userTableBody.appendChild(tr);
            }
        }

        function renderBreaks(search) {
            clear(breakTableBody);
            let active = 0;
            let today = new Date().toLocaleDateString();

            for (let i = 0; i < breaks.length; i++) {
                let b = breaks[i];
                let d = new Date(b.startTime);

                if (d.toLocaleDateString() !== today) {
                    continue;
                }

                if (search) {
                    if (!b.username.toLowerCase().includes(search.toLowerCase())) {
                        continue;
                    }
                }

                if (b.status === "ACTIVE") {
                    active++;
                }

                let tr = document.createElement("tr");

                let tdUser = document.createElement("td");
                tdUser.textContent = b.username;

                let tdType = document.createElement("td");
                tdType.textContent = b.type;

                let tdDate = document.createElement("td");
                tdDate.textContent = d.toLocaleDateString();

                let tdTime = document.createElement("td");
                tdTime.textContent = d.toLocaleTimeString();

                let tdDuration = document.createElement("td");
                let dur = Date.now() - b.startTime;
                if (b.endTime) {
                    dur = b.endTime - b.startTime;
                }
                tdDuration.textContent = formatDuration(dur, b.type);

                let tdStatus = document.createElement("td");
                tdStatus.textContent = b.status;

                let tdAction = document.createElement("td");

                if (b.status === "ACTIVE") {
                    let btn = document.createElement("button");
                    btn.textContent = "End";
                    btn.className = "end-brk-btn";

                    btn.onclick = function () {
                        b.status = "ENDED";
                        b.endTime = Date.now();

                        for (let j = 0; j < users.length; j++) {
                            if (users[j].email === b.email) {
                                users[j].availability = "ONLINE";
                            }
                        }

                        localStorage.setItem("breaks", JSON.stringify(breaks));
                        localStorage.setItem("users", JSON.stringify(users));

                        renderBreaks(breakSearch.value);
                        renderUsers(userSearch.value, availabilityFilter.value);
                        renderStats();
                    };

                    tdAction.appendChild(btn);
                } else {
                    tdAction.textContent = "-";
                }

                tr.append(tdUser, tdType, tdDate, tdTime, tdDuration, tdStatus, tdAction);
                breakTableBody.appendChild(tr);
            }

            document.getElementById("activeBreaks").textContent = active;
        }

        function renderStats() {
            document.getElementById("totalUsers").textContent = users.length;

            let online = 0;
            for (let i = 0; i < users.length; i++) {
                if (users[i].availability === "ONLINE") {
                    online++;
                }
            }
            document.getElementById("onlineUsers").textContent = online;
        }

        document.getElementById("addUserBtn").onclick = function () {
            let u = document.getElementById("newUsername").value.trim();
            let e = document.getElementById("newUserEmail").value.trim();
            let p = document.getElementById("newUserPassword").value.trim();

            if (u === "" || e === "" || p === "") {
                alert("All fields required");
                return;
            }

            for (let i = 0; i < users.length; i++) {
                if (users[i].email === e) {
                    alert("User already exists");
                    return;
                }
            }

            users.push({
                username: u,
                email: e,
                password: p,
                status: "Active",
                availability: "OFFLINE"
            });

            localStorage.setItem("users", JSON.stringify(users));

            document.getElementById("newUsername").value = "";
            document.getElementById("newUserEmail").value = "";
            document.getElementById("newUserPassword").value = "";

            renderUsers(userSearch.value, availabilityFilter.value);
            renderStats();
        };

        document.getElementById("logoutBtn").onclick = function () {
            sessionStorage.removeItem("loggedInAdmin");
            window.location.href = "../index.html";
        };

        renderUsers("", "all");
        renderBreaks("");
        renderStats();

        setInterval(function () {
            if (pauseRealtime) {
                return;
            }

            users = JSON.parse(localStorage.getItem("users")) || [];
            breaks = JSON.parse(localStorage.getItem("breaks")) || [];

            renderUsers(userSearch.value, availabilityFilter.value);
            renderBreaks(breakSearch.value);
            renderStats();
        }, 1000);
    </script>

</body>

</html>
