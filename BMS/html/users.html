<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="../css/user.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="pg-header">
        <div class="header-left">
            <img src="../images/oppty (1).png" width="100">
            <span class="pg-title">User Dashboard</span>
        </div>
        <div class="header-right">
            <span id="loggedInUser"></span>
            <button id="logoutBtn">Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>My Status</h3>
            <p id="userCurrentStatus" class="status-pill">WORKING</p>

            <h3>Team Status</h3>
            <ul id="teamStatusList" style="list-style: none;"></ul>
        </aside>

        <main class="workspace">
            <section class="current-session card">
                <h2>Current Session</h2>
                <p>You are currently <strong id="workstate">WORKING</strong></p>
                <p id="breakTimer">00:00:00</p>

                <div class="break-actions">
                    <button id="lunchBreakBtn">Start Lunch Break</button>
                    <button id="regularBreakBtn">Start Regular Break</button>
                    <button id="endBreakBtn">End Break</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        const email = sessionStorage.getItem("loggedInUser");
        if (!email) {
            window.location.href = "../index.html";
        }

        let users = JSON.parse(localStorage.getItem("users")) || [];
        let breaks = JSON.parse(localStorage.getItem("breaks")) || [];
        let activities = JSON.parse(localStorage.getItem("userActivities")) || [];

        let currentUser = null;
        for (let i = 0; i < users.length; i++) {
            if (users[i].email === email) {
                currentUser = users[i];
            }
        }

        if (!currentUser) {
            window.location.href = "../index.html";
        }

        document.getElementById("loggedInUser").textContent = currentUser.username;

        const statusEl = document.getElementById("userCurrentStatus");
        const workStateEl = document.getElementById("workstate");
        const timerEl = document.getElementById("breakTimer");
        const teamList = document.getElementById("teamStatusList");

        const activityBox = document.createElement("div");
        activityBox.className = "activity-box";
        document.querySelector(".workspace").appendChild(activityBox);

        const teamCountBox = document.createElement("p");
        const teamSearch = document.createElement("input");
        teamSearch.type = "text";
        teamSearch.placeholder = "Search team member";
        teamSearch.style.padding = "5px";

        const sidebar = document.querySelector(".sidebar");
        sidebar.insertBefore(teamCountBox, teamList);
        sidebar.insertBefore(teamSearch, teamList);

        let timerInterval = null;

        function saveActivities() {
            localStorage.setItem("userActivities", JSON.stringify(activities));
        }

        function logActivity(message) {
            if (!message) return;

            activities.push({
                email: email,
                message: message,
                time: Date.now()
            });

            saveActivities();
            renderActivity();
        }

        function renderActivity() {
            while (activityBox.firstChild) {
                activityBox.removeChild(activityBox.firstChild);
            }

            const h3 = document.createElement("h3");
            h3.textContent = "My Activity";
            activityBox.appendChild(h3);

            for (let i = 0; i < activities.length; i++) {
                if (activities[i].email !== email) continue;
                if (!activities[i].message) continue;

                const div = document.createElement("div");
                div.className = "activity-item";
                div.textContent =
                    new Date(activities[i].time).toLocaleTimeString() +
                    " - " +
                    activities[i].message;

                activityBox.appendChild(div);
            }
        }

        function getActiveBreak() {
            for (let i = 0; i < breaks.length; i++) {
                if (breaks[i].email === email && breaks[i].status === "ACTIVE") {
                    return breaks[i];
                }
            }
            return null;
        }

        function updateAvailability(state) {
            for (let i = 0; i < users.length; i++) {
                if (users[i].email === email) {
                    users[i].availability = state;
                }
            }
            localStorage.setItem("users", JSON.stringify(users));
        }

        function renderTeam() {
            teamList.innerHTML = "";

            let online = 0;
            let offline = 0;
            let filter = teamSearch.value.toLowerCase();

            for (let i = 0; i < users.length; i++) {
                if (users[i].availability === "ONLINE") {
                    online++;
                } else {
                    offline++;
                }

                if (filter && !users[i].username.toLowerCase().includes(filter)) {
                    continue;
                }

                const li = document.createElement("li");
                const dot = document.createElement("span");

                dot.style.width = "14px";
                dot.style.height = "14px";
                dot.style.borderRadius = "50%";
                dot.style.display = "inline-block";
                dot.style.marginRight = "8px";

                if (users[i].availability === "ONLINE") {
                    dot.style.background = "#27ae60";
                } else {
                    dot.style.background = "#e11c06";
                }

                li.append(dot, document.createTextNode(users[i].username));
                teamList.appendChild(li);
            }

            teamCountBox.textContent = "Online: " + online + " | Offline: " + offline;
        }

        function setWorkingUI() {
            statusEl.textContent = "WORKING 💼";
            statusEl.style.background = "#27ae60";
            statusEl.style.color = "#fff";
            workStateEl.textContent = "WORKING";
        }

        function setLunchUI() {
            statusEl.textContent = "LUNCH BREAK 🍱";
            statusEl.style.background = "#e11c06";
            statusEl.style.color = "#fff";
            workStateEl.textContent = "ON BREAK";
        }

        function setRegularUI() {
            statusEl.textContent = "REGULAR BREAK ☕";
            statusEl.style.background = "#e11c06";
            statusEl.style.color = "#fff";
            workStateEl.textContent = "ON BREAK";
        }

        function getLimit(type) {
            if (type === "LUNCH") {
                return 3600000;
            }
            return 900000;
        }

        function startTimer(startTime, type) {
            clearInterval(timerInterval);

            const limit = getLimit(type);

            timerInterval = setInterval(function () {
                let diff = Date.now() - startTime;

                if (diff >= limit) {
                    diff = limit;
                    clearInterval(timerInterval);
                    alert(type + " break limit exceeded");
                }

                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);

                timerEl.textContent =
                    String(h).padStart(2, "0") + ":" +
                    String(m).padStart(2, "0") + ":" +
                    String(s).padStart(2, "0");
            }, 1000);
        }

        function startBreak(type) {
            if (getActiveBreak()) {
                alert("You already have an active break");
                return;
            }

            const b = {
                email: email,
                username: currentUser.username,
                type: type,
                startTime: Date.now(),
                status: "ACTIVE"
            };

            breaks.push(b);
            localStorage.setItem("breaks", JSON.stringify(breaks));

            updateAvailability("OFFLINE");

            if (type === "LUNCH") {
                setLunchUI();
            }

            if (type === "REGULAR") {
                setRegularUI();
            }

            startTimer(b.startTime, type);
            logActivity(type + " break started");
            renderTeam();
        }

        function endBreak() {
            const active = getActiveBreak();
            if (!active) {
                alert("No active break");
                return;
            }

            active.status = "ENDED";
            active.endTime = Date.now();

            localStorage.setItem("breaks", JSON.stringify(breaks));

            updateAvailability("ONLINE");
            setWorkingUI();

            clearInterval(timerInterval);
            timerEl.textContent = "00:00:00";

            logActivity(active.type + " break ended");
            renderTeam();
        }

        document.getElementById("lunchBreakBtn").onclick = function () {
            startBreak("LUNCH");
        };

        document.getElementById("regularBreakBtn").onclick = function () {
            startBreak("REGULAR");
        };

        document.getElementById("endBreakBtn").onclick = function () {
            endBreak();
        };

        document.getElementById("logoutBtn").onclick = function () {
            logActivity("User logged out");
            sessionStorage.removeItem("userLogged");
            sessionStorage.removeItem("loggedInUser");
            window.location.href = "../index.html";
        };

        if (!sessionStorage.getItem("userLogged")) {
            logActivity("User logged in");
            sessionStorage.setItem("userLogged", "true");
        }

        const existing = getActiveBreak();
        if (existing) {
            updateAvailability("OFFLINE");

            if (existing.type === "LUNCH") {
                setLunchUI();
            }

            if (existing.type === "REGULAR") {
                setRegularUI();
            }

            startTimer(existing.startTime, existing.type);
        } else {
            setWorkingUI();
        }

        teamSearch.oninput = function () {
            renderTeam();
        };

        renderTeam();
        renderActivity();

        setInterval(function () {
            users = JSON.parse(localStorage.getItem("users")) || [];
            breaks = JSON.parse(localStorage.getItem("breaks")) || [];
            renderTeam();
        }, 2000);
    </script>



</body>

</html>
