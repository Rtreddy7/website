<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            /* transform: translate(150px, 40px); */
            transition: 1s ease-in-out;


        }

        .box:hover{
            transform: translateX(200px);
            /* transform: scale(.7); */
            /* transform: rotate(185deg); */
            /* transform: skew(30deg); */

        }

        button{
            transition: 0.3s;
            cursor: pointer;
        }

        button:hover{
            background: blue;
            padding: 12px 24px;
            transform: scale(1.3);
            color: #fff;


        }

        .box1{
            width: 100px;
            height: 100px;
            background-color: green;
            animation: movebox 5s linear infinite alternate;
        }

        @keyframes movebox{
            0%{
                transform: translateX(0);
            }

            100%{
                transform: translateX(300px);
                background: red;
            }
        }
    </style>
</head>
<body>
    <!-- transforms & transitions -->

    <!--  position, rotate, scale, tilt -->

    <!-- <div class="box">

    </div> -->

    <button>Hover me</button>

    <div class="box1"></div>
</body>
</html>
