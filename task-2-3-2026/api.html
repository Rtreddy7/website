<!DOCTYPE html>
<html>
<head>
  <title>API Demo</title>
</head>
<body>

  <h2>REST API Demo</h2>

  <button id="getUser">GET User</button>
  <button id="getList">GET Users List</button>
  <button id="createUser">POST</button>
  <button id="updateUser">PUT</button>
  <button id="deleteUser">DELETE</button>

  <hr>

  <p>Status: <span id="status">-</span></p>
  <p>Name(s): <span id="name">-</span></p>
  <p>Error: <span id="error">-</span></p>

  <script>

    var statusField = document.getElementById("status");
    var nameField = document.getElementById("name");
    var errorField = document.getElementById("error");

    function clear() {
      statusField.textContent = "-";
      nameField.textContent = "-";
      errorField.textContent = "-";
    }

    function handleResponse(response) {

      statusField.textContent = response.status;

      if (!response.ok) {
        throw new Error("Request failed with status " + response.status);
      }

      return response.json();
    }

    function handleError(error) {
      errorField.textContent = error.message;
    }

    // GET (Path Param)
    document.getElementById("getUser").onclick = function() {

      clear();

      fetch("https://dummyjson.com/users/1")

      .then(handleResponse)

      .then(function(data) {

        nameField.textContent = data.firstName + " " + data.lastName;

      })

      .catch(handleError);

    };


    // GET (Query Param)
    document.getElementById("getList").onclick = function() {

      clear();

      fetch("https://dummyjson.com/users?limit=x")

      .then(handleResponse)

      .then(function(data) {

        var users = data.users;

        var names = users.map(function(user) {
          return user.firstName + " " + user.lastName;
        }).join(" | ");

        nameField.textContent = names;

      })

      .catch(handleError);

    };


    // POST (Create)
    document.getElementById("createUser").onclick = function() {

      clear();

      fetch("https://dummyjson.com/users/add", {

        method: "POST",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify({
          firstName: "John",
          lastName: "Doe"
        })

      })

      .then(handleResponse)

      .then(function(data) {

        nameField.textContent = data.firstName + " " + data.lastName;

      })

      .catch(handleError);

    };


    // PUT (Update)
    document.getElementById("updateUser").onclick = function() {

      clear();

      fetch("https://dummyjson.com/users/1", {

        method: "PUT",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify({
          firstName: "Dwayne"
        })

      })

      .then(handleResponse)

      .then(function(data) {

        nameField.textContent = data.firstName + " " + data.lastName;

      })

      .catch(handleError);

    };


    // DELETE
    document.getElementById("deleteUser").onclick = function() {

      clear();

      fetch("https://dummyjson.com/users/1", {

        method: "DELETE"

      })

      .then(function(response) {

        statusField.textContent = response.status;

        if (!response.ok) {
          throw new Error("Request failed with status " + response.status);
        }

        nameField.textContent = "Deleted";

      })

      .catch(handleError);

    };

  </script>

</body>
</html>
